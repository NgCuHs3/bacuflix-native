name: Build Android APK (Native Kotlin)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Ensure Deterministic Debug Keystore
        run: |
          mkdir -p ~/.android ~/.gradle/caches
          if [ -f ~/.gradle/caches/bacuflix-debug.keystore ]; then
            cp ~/.gradle/caches/bacuflix-debug.keystore ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore ~/.gradle/caches/bacuflix-debug.keystore
          fi

      - name: Run Unit Tests & Build Android Debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            grep -E "^e: |FAILURE:|What went wrong:|FAILED" gradle-build.log | head -n 9 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $EXIT_CODE
          fi

      - name: Upload BACUFlix Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BACUFlix-Native-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
